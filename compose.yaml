# Production-style setup: nginx on port 80 in front of the Node app.
# Only nginx is published; the app is reachable only inside this network.
services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      # Optional. Add DATABASE_URL here to use RDS instead of the local JSON file.
      - path: .env
        required: false
    volumes:
      - signups:/data

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${AWS_SBG_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  signups:
