# nginx in front of the Node app. Visitors reach port 80; only nginx talks to the app.
# To run more app copies later, add them to the upstream block and nginx will spread
# requests across them (round robin). With the JSON file store that is unsafe, which is
# one reason the workshop moves storage to RDS.

upstream signup_app {
    server app:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 16k;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://signup_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
